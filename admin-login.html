<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counsellor Login | Career Compass</title>
    <meta name="description" content="Demo counsellor and admin login for Career Compass." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
    <link href="assets/css/admin.css" rel="stylesheet" />
  </head>
  <body data-page="admin-login">
    <main class="admin-login-shell">
      <div class="cgams-card admin-login-card">
        <div class="d-flex align-items-center gap-3 mb-4">
          <img src="assets/images/logo-compass.svg" alt="Career Compass Logo" width="44" height="44" />
          <div>
            <div class="small fw-semibold text-teal">Career Compass</div>
            <h1 class="h4 fw-bold mb-0">Counsellor Admin Login</h1>
          </div>
        </div>

        <div class="p-3 rounded border bg-light mb-4 small">
          <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1 text-primary"></i> Demo Access</div>
          <div class="text-secondary mb-2">
            Use the demo credentials below to inspect analytics, student submissions, questions, and careers.
          </div>
          <div class="font-mono-num text-dark">
            Username: <strong>admin</strong> · Password: <strong>admin123</strong>
          </div>
          <button type="button" id="btnFillDemoCreds" class="btn btn-outline-slate btn-sm mt-2">
            Fill Demo Credentials
          </button>
        </div>

        <div id="loginErrorAlert" class="alert alert-danger py-2 small d-none">
          Invalid credentials. Please use <strong>admin</strong> / <strong>admin123</strong>.
        </div>

        <form id="adminLoginForm">
          <div class="mb-3">
            <label class="form-label" for="loginUsername">Username</label>
            <input type="text" class="form-control" id="loginUsername" placeholder="admin" required />
          </div>
          <div class="mb-4">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" class="form-control" id="loginPassword" placeholder="admin123" required />
          </div>
          <button type="submit" class="btn btn-primary-navy w-100 mb-3">
            Sign In to Admin Panel <i class="bi bi-arrow-right"></i>
          </button>
          <a href="index.html" class="btn btn-outline-slate w-100">
            <i class="bi bi-arrow-left"></i> Back to Student Portal
          </a>
        </form>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
